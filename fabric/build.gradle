buildscript {
    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
}

plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom}"
    id 'idea'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.mod_group

repositories {
    maven {
        name = "Terraformers" // Modmenu
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // Modmenu
    implementation("com.terraformersmc:modmenu:${modmenu_version}")
    // Configuration
    implementation("dev.toma.configuration:configuration-fabric:${configuration_version}")
    // Trinkets updated
    implementation "eu.pb4:trinkets:${trinkets_version}"
    // JEI
    compileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

    compileOnly project(":common")
}

loom {
    def accessWidenerFile = project(":common").file("src/main/resources/${mod_id}.accesswidener")
    accessWidenerPath.set(accessWidenerFile)

    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run/server")
        }
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "${mod_name}",
                "Specification-Vendor"    : "${mod_authors}",
                "Specification-Version"   : "${mod_version}",
                "Implementation-Title"    : "${mod_name}",
                "Implementation-Version"  : "${mod_version}",
                "Implementation-Vendor"   : "${mod_authors}",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    exclude("META-INF/accesstransformer.cfg")
}

processResources {
    from project(":common").sourceSets.main.resources
}

tasks.withType(JavaCompile) {
    source(project(":common").sourceSets.main.allSource)
}