modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"
license = "${mod_licence}"
issueTrackerURL = "https://github.com/T-T-Team/CollectorsAlbum/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
iconFile = "assets/icon.png"
authors = "${mod_authors}"
description = '''${mod_description}'''
displayURL = "https://www.curseforge.com/minecraft/mc-mods/collectors-album"

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}.neoforge.mixins.json"

[[accessTransformers]]
file = "META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoforge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId="configuration"
    mandatory=true
    versionRange="${configuration_version_range}"
    ordering="NONE"
    side="BOTH"