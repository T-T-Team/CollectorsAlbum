name: Publish
on:
  push:
    tags:
      - 'version/*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Prepare Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Release
        run: ./gradlew publishMod -PCURSEFORGE_TOKEN=${{ secrets.CF_TOKEN }} -PMODRINTH_TOKEN=${{ secrets.MODRINTH_TOKEN }} --no-configuration-cache

      - name: Prepare changelog content
        id: changelog
        uses: Toma1O6/file-read-action@v1
        with:
          file: 'CHANGELOG.md'
          max-chars: '4096'

      - name: Trigger discord webhook
        env:
          WEBHOOK: ${{ secrets.WEBHOOK_URL }}
          CHANGELOG: ${{ steps.changelog.outputs.content }}
        run: |
          jq -n \
          --arg snippet "$CHANGELOG" \
            '{
              username: "Release bot",
              avatar_url: "https://cdn.discordapp.com/avatars/1308464796831711244/e886df028da3a37ad84b05e3fb0c3b8b.webp?size=32",
              content: "<@&1050082657511411763>",
              embeds: [
                {
                  title: "Collectors Album",
                  url: "https://www.curseforge.com/minecraft/mc-mods/collectors-album",
                  description: ($snippet),
                  color: 9576191,
                  thumbnail: { url: "https://media.forgecdn.net/avatars/589/367/637960226211119035.png" },
                  fields: [
                    {
                      name: "CurseForge",
                      value: "[Download](<https://www.curseforge.com/minecraft/mc-mods/collectors-album>)",
                      inline: true
                    },
                    {
                      name: "Modrinth",
                      value: "[Download](<https://modrinth.com/mod/collectors-album>)",
                      inline: true
                    },
                    {
                      name: "Sources",
                      value: "[GitHub](<https://github.com/T-T-Team/CollectorsAlbum>)",
                      inline: true
                    },
                    {
                      name: "Support",
                      value: "[Patreon](<https://www.patreon.com/c/tnt_team>)",
                      inline: false
                    },
                    {
                      name: "Report issue",
                      value: "[GitHub](<https://github.com/T-T-Team/CollectorsAlbum/issues>)",
                      inline: true
                    },
                    {
                      name: "Guides",
                      value: "[GitHub](<https://github.com/T-T-Team/CollectorsAlbum/issues>)",
                      inline: true
                    },
                    {
                      name: "Official datapacks",
                      value: "[Releases](<https://github.com/T-T-Team/CollectorsAlbum-ExampleAddon/releases>)",
                      inline: true
                    }
                  ],
                  footer: { text: "CurseForge file may take up to 1 hour to be published" }
                }
              ]
            }' > payload.json
          
          curl "$WEBHOOK" \
            -H "Content-Type: application/json" \
            --data @payload.json